<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidGet — Video Downloader</title>
<!-- Meta Pixel: apni Pixel ID yahan daalein (publish + ads ke liye tayyar) -->

<style>
  body{font-family:system-ui,sans-serif;background:#0f1222;color:#fff;max-width:640px;margin:40px auto;padding:0 16px}
  h1{font-size:28px} h1 span{color:#ff4d6d}
  .card{background:#1a1e35;border-radius:16px;padding:20px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #33395c;background:#0f1222;color:#fff;margin:8px 0;box-sizing:border-box}
  button{width:100%;padding:13px;border:0;border-radius:10px;background:#ff4d6d;color:#fff;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6}
  #msg{margin-top:14px;line-height:1.6} a{color:#7dd3fc}
  .grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .grid span{background:#232747;border-radius:20px;padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<h1>VidGet <span>⬇</span></h1>
<p>Kisi bhi social media ka link paste karo — video foran download ho jayegi.</p>
<div class="card">
  <input id="url" placeholder="Video ka link yahan paste karo… (YouTube, TikTok, Instagram, Facebook, X, Snapchat…)">
  <select id="quality">
    <option value="2160p">4K (2160p) — Sab se best</option>
    <option value="1080p">1080p HD</option>
    <option value="720p" selected>720p</option>
    <option value="480p">480p</option>
    <option value="mp3">MP3 Audio</option>
  </select>
  <button id="go" onclick="go()">Download</button>
  <div id="msg"></div>
</div>
<div class="grid">
  <span>▶ YouTube</span><span>♪ TikTok</span><span>📸 Instagram</span>
  <span>f Facebook</span><span>𝕏 X (Twitter)</span><span>👻 Snapchat</span>
  <span>Reddit</span><span>Vimeo</span><span>Twitch</span><span>Pinterest</span>
</div>
<script>
async function go(){
  const url=document.getElementById('url').value.trim();
  const quality=document.getElementById('quality').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('go');
  if(!url.startsWith('http')){msg.textContent='Pehle valid link daalein.';return;}
  btn.disabled=true; msg.textContent='Link check ho raha hai…';
  try{
    // Rasta 1: foran direct file (koi wait nahi)
    let r=await fetch('/api/direct',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,quality})});
    let d=await r.json();
    if(d.direct_url){
      msg.innerHTML='Download shuru ho gaya! Agar khud shuru na ho to <a href="'+d.direct_url+'" download="'+(d.filename||'video')+'">yahan click karo</a>.';
      const a=document.createElement('a'); a.href=d.direct_url; a.download=d.filename||'video'; document.body.appendChild(a); a.click(); a.remove();
      btn.disabled=false; return;
    }
    // Rasta 2: server par merge (1080p/4K YouTube waghera)
    msg.textContent=d.needs_merge ? 'Ye quality server par tayyar ho rahi hai (video+audio jur rahe hain)…' : ('Direct link nahi mila, server se try ho raha hai…');
    r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,quality})});
    d=await r.json();
    if(d.error){msg.textContent='Error: '+d.error; btn.disabled=false; return;}
    const job=d.job_id;
    const timer=setInterval(async()=>{
      const s=await (await fetch('/api/status/'+job)).json();
      if(s.status==='downloading'){msg.textContent='Tayyar ho raha hai… thora intezaar karein.';}
      else if(s.status==='done'){
        clearInterval(timer); btn.disabled=false;
        msg.innerHTML='Tayyar hai! <a href="/api/file/'+job+'">File download karo</a>';
        window.location.href='/api/file/'+job;
      } else if(s.status==='error'){
        clearInterval(timer); btn.disabled=false; msg.textContent='Error: '+(s.error||'download fail ho gaya');
      }
    },3000);
  }catch(e){btn.disabled=false; msg.textContent='Error: server se rabta nahi ho saka. Backend chal raha hai?';}
}
</script>
</body>
</html>
